<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="220" height="70">
  <defs>
    <linearGradient id="ndtvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Red Badge Background -->
    <rect x="0" y="0" width="140" height="46" rx="8" fill="url(#ndtvGrad)" filter="url(#shadow)" />
    
    <!-- White Bold NDTV Text -->
    <text x="70" y="27" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">NDTV</text>

    <!-- Globe Ring / 24x7 Orb Accent -->
    <g transform="translate(152, 6)">
      <circle cx="16" cy="16" r="14" fill="none" stroke="#E53935" stroke-width="3" />
      <circle cx="16" cy="16" r="8" fill="#E53935" />
      <path d="M 4,16 Q 16,8 28,16 Q 16,24 4,16" fill="none" stroke="#FFFFFF" stroke-width="2" />
    </g>
  </g>
</svg>
