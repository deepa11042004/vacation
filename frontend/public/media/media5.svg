<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="260" height="70">
  <g transform="translate(10, 10)">
    <!-- ET Square Badge Icon -->
    <rect x="0" y="0" width="50" height="50" rx="6" fill="#800020"/>
    <text x="25" y="34" dominant-baseline="middle" text-anchor="middle" font-family="'Times New Roman', serif" font-weight="bold" font-style="italic" font-size="28" fill="#F0E6D2">ET</text>

    <!-- Logotype -->
    <g transform="translate(62, 8)">
      <text x="0" y="18" font-family="'Times New Roman', Times, serif" font-weight="900" font-size="14" fill="#800020" letter-spacing="1">THE ECONOMIC TIMES</text>
      <line x1="0" y1="25" x2="180" y2="25" stroke="#800020" stroke-width="1.5"/>
      <text x="0" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#555555" letter-spacing="2">INDIA FINANCIAL MEDIA</text>
    </g>
  </g>
