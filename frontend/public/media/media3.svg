<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <g transform="translate(10, 10)">
    <!-- Red Box Emblem -->
    <rect x="0" y="0" width="50" height="50" rx="4" fill="#D32F2F"/>
    <text x="25" y="24" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">IT</text>
    <rect x="5" y="36" width="40" height="6" fill="#FFD54F"/>

    <!-- INDIA TODAY Logotype -->
    <g transform="translate(62, 10)">
      <text x="0" y="16" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="20" fill="#212121" letter-spacing="1">INDIA</text>
      <text x="0" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="20" fill="#D32F2F" letter-spacing="1">TODAY</text>
    </g>
  </g>
</svg>
